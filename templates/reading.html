<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
{{common_css}}
/* ---- 课文阅读版 ---------------------------------------------------- */
main.flow { text-align: justify; text-justify: inter-ideograph; }
.para {
  margin: 0 0 calc(var(--fs) * var(--vgap));
  line-height: calc(var(--rowh) + var(--fs) * var(--lgap));
  text-indent: calc(var(--cell) * 2);   /* 两个注音格：与教材拼音读物一致 */;
}
.para:last-child { margin-bottom: 0; }
.py-note {
  margin-top: calc(var(--fs) * 1.2);
  text-align: center;
  font-size: calc(var(--fs) * .5);
  color: #6a7280;
  font-family: var(--fp);
}
</style>
</head>
<body class="{{body_class}}">
<div class="sheet">
  {{header}}
  <main class="flow">{{paragraphs}}</main>
  {{footer}}
</div>
<script type="application/json" id="cpt-spec">{{spec_json}}</script>
</body>
</html>
