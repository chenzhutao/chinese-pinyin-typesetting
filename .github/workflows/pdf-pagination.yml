name: PDF pagination consistency
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/check_pdf_pagination.py'
      - '.github/workflows/pdf-pagination.yml'
      - 'scripts/renderer.py'
      - 'scripts/templates/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Compare estimates with actual PDF pages
        run: python tests/check_pdf_pagination.py
