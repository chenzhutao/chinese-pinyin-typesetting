name: Publish GitHub Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create or update v1.3.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --output=chinese-pinyin-typesetting.zip main
          cat > release-notes.md <<'EOF'
          ## 中文说明
          
          ### 本次更新
          
          - **PDF 排版**：改进分页页数估算，减少排版预估与实际 PDF 页数之间的偏差。
          - **注音样本库**：新增结构化的教材与古诗读音样本，便于持续积累和验证已核实的读音。
          - **人工纠音**：修复人工指定读音后，旧的自动规则仍出现在复核列表中的问题；人工纠音现在作为最终结果。
          - **项目文档**：更新中英文 README，并加入真实排版截图。
          
          ### 下载
          
          下载下方的 `chinese-pinyin-typesetting.zip`，解压后按项目说明安装或使用。
          
          ---
          
          ## English
          
          ### Highlights
          
          - **PDF layout**: Improved pagination estimation to better match the actual number of rendered PDF pages.
          - **Pronunciation fixtures**: Added a structured dataset of verified textbook and classical-poem readings.
          - **Manual overrides**: Fixed stale automatic-review entries after a manual pronunciation override. Manual corrections now remain authoritative.
          - **Documentation**: Updated the Chinese and English READMEs with real rendered screenshots.
          
          ### Download
          
          Download `chinese-pinyin-typesetting.zip` below and follow the project documentation to install or use it.
          
          See [CHANGELOG.md](https://github.com/chenzhutao/chinese-pinyin-typesetting/blob/main/CHANGELOG.md) for details.
          EOF
          if gh release view v1.3.3 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release edit v1.3.3 \
              --repo ${{ github.repository }} \
              --title "v1.3.3 — 注音准确性与 PDF 排版可靠性改进" \
              --notes-file release-notes.md
            gh release upload v1.3.3 chinese-pinyin-typesetting.zip --repo ${{ github.repository }} --clobber
          else
            gh release create v1.3.3 chinese-pinyin-typesetting.zip \
              --repo ${{ github.repository }} \
              --target main \
              --title "v1.3.3 — 注音准确性与 PDF 排版可靠性改进" \
              --notes-file release-notes.md
          fi
