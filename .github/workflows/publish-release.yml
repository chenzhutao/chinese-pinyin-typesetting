name: Publish GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.3.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.3 --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release v1.3.3 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v1.3.3 \
            --repo ${{ github.repository }} \
            --target main \
            --title "v1.3.3" \
            --generate-notes \
            --notes-start-tag v1.3.2 \
            --notes "### Highlights
          - Improved PDF pagination estimation and regression coverage.
          - Added curated textbook and classical-poem pronunciation fixtures.
          - Expanded manual pronunciation override priority tests.
          - Added automated pronunciation and PDF pagination checks.
          - Updated Chinese and English README previews.

          See CHANGELOG.md for details."
