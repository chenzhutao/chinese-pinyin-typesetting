name: Full pronunciation tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_pronunciation.py'
      - 'tests/data/**'
      - 'scripts/pronunciation.py'
      - 'scripts/vendor/**'
      - '.github/workflows/pronunciation-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run full pronunciation test suite
        run: python -m pytest tests/test_pronunciation.py -v --tb=short
